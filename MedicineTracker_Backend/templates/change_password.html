{% extends 'base.html' %}
{% block content %}
<div class='row justify-content-center'>
<div class='col-md-5'>
<div class='card p-4 shadow'>
<h4 class='mb-3'>🔒 Change Password</h4>
<div id='message'></div>
<div class='mb-3'>
    <label>Current Password</label>
    <div class='password-wrapper' style='position:relative'>
        <input type='password' id='current_password' class='form-control' style='padding-right:40px'>
        <button type='button' onclick='togglePwd("current_password",this)' style='position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:none;cursor:pointer'>👁️</button>
    </div>
</div>
<div class='mb-3'>
    <label>New Password</label>
    <div class='password-wrapper' style='position:relative'>
        <input type='password' id='new_password' class='form-control' style='padding-right:40px'>
        <button type='button' onclick='togglePwd("new_password",this)' style='position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:none;cursor:pointer'>👁️</button>
    </div>
</div>
<div class='mb-3'>
    <label>Confirm New Password</label>
    <div class='password-wrapper' style='position:relative'>
        <input type='password' id='confirm_password' class='form-control' style='padding-right:40px'>
        <button type='button' onclick='togglePwd("confirm_password",this)' style='position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:none;cursor:pointer'>👁️</button>
    </div>
</div>
<button onclick='changePassword()' class='btn btn-success w-100'>Update Password</button>
<a href='/dashboard' class='btn btn-secondary w-100 mt-2'>Cancel</a>
</div>
</div>
</div>

<script>
function togglePwd(id, btn) {
    const f = document.getElementById(id);
    f.type = f.type === 'password' ? 'text' : 'password';
    btn.textContent = f.type === 'password' ? '👁️' : '🙈';
}

function changePassword() {
    const data = {
        current_password: document.getElementById('current_password').value,
        new_password: document.getElementById('new_password').value,
        confirm_password: document.getElementById('confirm_password').value
    };
    fetch('/change-password', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    })
    .then(r => r.json())
    .then(data => {
        const msg = document.getElementById('message');
        if(data.success) {
            msg.innerHTML = "<div class='alert alert-success'>✅ Password changed successfully!</div>";
            setTimeout(() => window.location.href='/dashboard', 2000);
        } else {
            msg.innerHTML = `<div class='alert alert-danger'>❌ ${data.error}</div>`;
        }
    });
}
</script>
{% endblock %}
