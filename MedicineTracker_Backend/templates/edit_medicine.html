{% extends 'base.html' %}
{% block content %}
<div class='row justify-content-center'>
<div class='col-md-6'>
<div class='card p-4 shadow'>
<h4 class='mb-3'>✏️ Edit Medicine</h4>
<div>
    <div class='mb-3'>
        <label>Medicine Name</label>
        <input type='text' id='med_name' class='form-control'
               value='{{ medicine.name }}' required autocomplete='off'>
        <small id='name-feedback' class='text-success'>✅ Valid medicine name</small>
    </div>
    <div class='mb-3'>
        <label>Family Member</label>
        <select id='member_id' class='form-select'>
            <option value=''>Select Member</option>
            {% for m in members %}
            <option value='{{ m.member_id }}'
                {% if m.member_id == medicine.member_id %}selected{% endif %}>
                {{ m.name }}
            </option>
            {% endfor %}
        </select>
    </div>
    <div class='mb-3'>
        <label>Category <small class='text-muted'>(auto-detected from medicine name)</small></label>
        <select id='category_id' class='form-select'>
            <option value=''>Select Category</option>
            {% for c in categories %}
            <option value='{{ c.category_id }}'
                data-name='{{ c.name.lower() }}'
                {% if c.category_id == medicine.category_id %}selected{% endif %}>
                {{ c.name }}
            </option>
            {% endfor %}
        </select>
        <small id='category-feedback' class='text-info'></small>
    </div>
    <div class='mb-3'>
        <label>Quantity</label>
        <input type='number' id='quantity' class='form-control'
               value='{{ medicine.quantity if medicine.quantity else 1 }}' min='1'>
    </div>
    <div class='mb-3'>
        <label>Purchase Date</label>
        <input type='date' id='purchase_date' class='form-control'
               value='{{ medicine.purchase_date }}'>
    </div>
    <div class='mb-3'>
        <label>Expiry Date</label>
        <input type='date' id='expiry_date' class='form-control'
               value='{{ medicine.expiry_date }}'>
    </div>
    <button onclick='submitEdit()' class='btn btn-success w-100'>Update Medicine</button>
    <a href='/dashboard' class='btn btn-secondary w-100 mt-2'>Cancel</a>
</div>
</div>
</div>
</div>

<script>
let nameValid = true; // Pre-filled name is already valid

const categoryKeywords = {
    'syrup': ['syrup', 'suspension', 'linctus', 'elixir', 'mixture', 'drops', 'solution'],
    'tablet': ['tablet', 'tab', 'pill', 'capsule', 'cap', '650', '500', '250', '400', 'mg'],
    'ointment': ['ointment', 'cream', 'gel', 'lotion', 'balm', 'paste', 'salve', 'topical'],
    'injection': ['injection', 'inj', 'vaccine', 'vial', 'ampule', 'infusion'],
    'inhaler': ['inhaler', 'inhale', 'spray', 'nasal', 'rotacap', 'nebulizer'],
    'powder': ['powder', 'sachet', 'granules', 'effervescent'],
    'eye': ['eye', 'ophthalmic', 'ocular', 'drops'],
    'ear': ['ear', 'otic'],
};

function autoDetectCategory(medicineName) {
    const nameLower = medicineName.toLowerCase();
    const categorySelect = document.getElementById('category_id');
    const options = categorySelect.options;
    const feedback = document.getElementById('category-feedback');

    for (const [catType, keywords] of Object.entries(categoryKeywords)) {
        for (const keyword of keywords) {
            if (nameLower.includes(keyword)) {
                for (let i = 0; i < options.length; i++) {
                    const optName = options[i].getAttribute('data-name') || '';
                    if (optName.includes(catType) || catType.includes(optName)) {
                        categorySelect.value = options[i].value;
                        feedback.textContent = `🔍 Auto-detected: ${options[i].text}`;
                        feedback.className = 'text-info';
                        return;
                    }
                }
            }
        }
    }
}

document.getElementById('med_name').addEventListener('input', function() {
    const name = this.value.trim();
    if (name.length >= 3) autoDetectCategory(name);
});

document.getElementById('med_name').addEventListener('blur', function() {
    const name = this.value.trim();
    if (!name) return;
    fetch('/api/validate-medicine?name=' + encodeURIComponent(name))
    .then(r => r.json())
    .then(data => {
        const fb = document.getElementById('name-feedback');
        if (data.valid) {
            fb.className = 'text-success';
            fb.innerText = '✅ ' + data.message;
            nameValid = true;
            autoDetectCategory(name);
        } else {
            fb.className = 'text-danger';
            fb.innerText = '⚠️ ' + data.message;
            nameValid = false;
        }
    });
});

function submitEdit() {
    const name = document.getElementById('med_name').value.trim();
    if (!name) { alert('Please enter medicine name'); return; }
    if (!nameValid) { alert('Please enter a valid medicine name'); return; }
    if (!document.getElementById('member_id').value) { alert('Please select a family member'); return; }
    if (!document.getElementById('category_id').value) { alert('Please select a category'); return; }
    if (!document.getElementById('expiry_date').value) { alert('Please enter expiry date'); return; }

    const formData = new FormData();
    formData.append('name', name);
    formData.append('member_id', document.getElementById('member_id').value);
    formData.append('category_id', document.getElementById('category_id').value);
    formData.append('quantity', document.getElementById('quantity').value);
    formData.append('purchase_date', document.getElementById('purchase_date').value);
    formData.append('expiry_date', document.getElementById('expiry_date').value);

    fetch('/edit/{{ medicine.medicine_id }}', {method: 'POST', body: formData})
    .then(r => { if (r.redirected) window.location.href = r.url; });
}
</script>
{% endblock %}
