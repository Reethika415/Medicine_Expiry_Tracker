<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<title>Login - Medicine Tracker</title>
<link href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css' rel='stylesheet'>
<style>
    body { background: linear-gradient(135deg, #1A6B3C, #2E75B6);
           min-height: 100vh; display: flex;
           align-items: center; justify-content: center; }
    .card { border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
    .password-wrapper { position: relative; }
    .password-wrapper .toggle-eye {
        position: absolute; right: 10px; top: 50%;
        transform: translateY(-50%);
        cursor: pointer; color: #666; background: none;
        border: none; padding: 0; font-size: 18px;
    }
    .google-btn {
        display: flex; align-items: center; justify-content: center;
        gap: 10px; background: white; border: 1px solid #ddd;
        color: #444; font-weight: 500;
        transition: box-shadow 0.2s;
    }
    .google-btn:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    .divider { display: flex; align-items: center; gap: 10px; color: #999; margin: 12px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #ddd; }
</style>
</head>
<body>
<div class='card p-4' style='width: 420px;'>
    <h3 class='text-center mb-4'>💊 Medicine Tracker</h3>

    {% if error %}
    <div class='alert alert-danger'>{{ error }}</div>
    {% endif %}

    <ul class='nav nav-tabs mb-3' id='authTabs'>
        <li class='nav-item'>
            <a class='nav-link active' data-bs-toggle='tab' href='#login'>Login</a>
        </li>
        <li class='nav-item'>
            <a class='nav-link' data-bs-toggle='tab' href='#register'>Register</a>
        </li>
    </ul>

    <div class='tab-content'>
        <!-- LOGIN TAB -->
        <div class='tab-pane fade show active' id='login'>
            <!-- Google Login -->
            <a href='/google-login' class='btn google-btn w-100 mb-2'></a>
                <img src='https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg' width='20'>
                Continue with Google
            </a>
            <div class='divider'>or</div>

            <form method='POST' action='/login'>
                <div class='mb-3'>
                    <label>Email</label>
                    <input type='email' name='email' class='form-control' required>
                </div>
                <div class='mb-3'>
                    <label>Password</label>
                    <div class='password-wrapper'>
                        <input type='password' name='password' id='login-password' class='form-control' required style='padding-right: 40px;'>
                        <button type='button' class='toggle-eye' onclick='togglePassword("login-password", this)'>👁️</button>
                    </div>
                </div>
                <button class='btn btn-success w-100'>Login</button>
            </form>
        </div>

        <!-- REGISTER TAB -->
        <div class='tab-pane fade' id='register'>
            <!-- Google Register -->
            <a href='/google-login' class='btn google-btn w-100 mb-2'></a>
                <img src='https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg' width='20'>
                Sign up with Google
            </a>
            <div class='divider'>or</div>

            <form method='POST' action='/register'>
                <div class='mb-3'>
                    <label>Full Name</label>
                    <input type='text' name='name' class='form-control' required>
                </div>
                <div class='mb-3'>
                    <label>Email</label>
                    <input type='email' name='email' class='form-control' required>
                </div>
                <div class='mb-3'>
                    <label>Phone</label>
                    <input type='text' name='phone' class='form-control'>
                </div>
                <div class='mb-3'>
                    <label>Password</label>
                    <div class='password-wrapper'>
                        <input type='password' name='password' id='register-password' class='form-control' required style='padding-right: 40px;'>
                        <button type='button' class='toggle-eye' onclick='togglePassword("register-password", this)'>👁️</button>
                    </div>
                </div>
                <button class='btn btn-primary w-100'>Register</button>
            </form>
        </div>
    </div>
</div>

<script src='https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js'></script>
<script>
function togglePassword(fieldId, btn) {
    const field = document.getElementById(fieldId);
    if (field.type === 'password') {
        field.type = 'text';
        btn.textContent = '🙈';
    } else {
        field.type = 'password';
        btn.textContent = '👁️';
    }
}
</script>
</body>
</html>
